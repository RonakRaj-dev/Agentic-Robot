apiVersion: apps/v1
kind: Deployment
metadata:
  name: edubot-api-gateway
  labels:
    app: edubot-api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: edubot-api-gateway
  template:
    metadata:
      labels:
        app: edubot-api-gateway
    spec:
      containers:
      - name: api-gateway
        image: edubot/api-gateway:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: AGENT_MODE
          value: "microservice"
        - name: SUPERVISORV3_URL
          value: "http://agent-supervisor:8008"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: edubot-api-gateway
  ports:
  - port: 8000
    targetPort: 8000
