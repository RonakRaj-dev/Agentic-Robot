apiVersion: apps/v1
kind: Deployment
metadata:
  name: edubot-agent-teaching
  labels:
    app: edubot-agent-teaching
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edubot-agent-teaching
  template:
    metadata:
      labels:
        app: edubot-agent-teaching
    spec:
      containers:
      - name: agent-teaching
        image: edubot/agent-teaching:latest
        ports:
        - containerPort: 8003
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: edubot-secrets
              key: groq-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: agent-teaching
spec:
  selector:
    app: edubot-agent-teaching
  ports:
  - port: 8003
    targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edubot-agent-supervisor
  labels:
    app: edubot-agent-supervisor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edubot-agent-supervisor
  template:
    metadata:
      labels:
        app: edubot-agent-supervisor
    spec:
      containers:
      - name: agent-supervisor
        image: edubot/agent-supervisor:latest
        ports:
        - containerPort: 8008
        env:
        - name: AGENT_MODE
          value: "microservice"
        - name: TEACHINGAGENT_URL
          value: "http://agent-teaching:8003"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-supervisor
spec:
  selector:
    app: edubot-agent-supervisor
  ports:
  - port: 8008
    targetPort: 8008
