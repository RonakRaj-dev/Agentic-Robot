[project]
name = "ncert-db"
version = "0.4.0"
description = "NCERT PDF ingestion pipeline with MongoDB document modeling + MinIO + PyMuPDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "minio>=7.2.20",
    "motor>=3.7.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "structlog>=26.1.0",
    "tenacity>=8.2.0",
    "pymupdf>=1.27.2.3",
]
