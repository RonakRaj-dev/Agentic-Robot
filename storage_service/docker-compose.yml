services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: carvedGamer2233
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"

  cloudflared-api:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://minio:9000
    depends_on:
      - minio

  cloudflared-console:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://minio:9001
    depends_on:
      - minio

volumes:
  minio_data:

