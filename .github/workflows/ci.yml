name: EduBot Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Automated Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
        pip install pytest pytest-asyncio flake8 bandit pip-audit

    - name: Run Code Style & Linting Checks
      run: |
        flake8 api services models --max-line-length=140 --ignore=E501,W503,E203 --statistics || true

    - name: Run Automated Test Suite
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        AGENT_MODE: monolith
      run: |
        pytest tests/ -v

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Security Scanners
      run: |
        pip install bandit pip-audit

    - name: Run Bandit SAST Security Analysis
      run: |
        bandit -r api/ services/ models/ -ll -ii || true

    - name: Audit Dependency Vulnerabilities
      run: |
        pip-audit -r requirements.txt || true

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verify Base Image Build
      run: |
        docker build -t edubot-base:latest -f docker/Dockerfile.base .

    - name: Verify Docker Compose Configuration
      run: |
        docker compose config
